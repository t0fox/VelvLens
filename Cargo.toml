[package]
name = "sublens"
version = "0.1.4"
edition = "2021"
description = "Local visual proxy subscription inspector"
license = "MIT"
default-run = "sublens"

[dependencies]
arboard = { version = "3.4", default-features = false }
base64 = "0.22"
directories = "6"
eframe = { version = "0.29", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11"] }
egui = "0.29"
futures-util = "0.3"
percent-encoding = "2.3"
qrcode = "0.14"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "brotli", "deflate", "zstd"] }
scraper = "0.22"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Memory"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "sublens"
path = "src/main.rs"
