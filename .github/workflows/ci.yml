name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo build --release --bins
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: sublens-windows-x86_64
          path: target/release/sublens.exe
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/sublens.exe
          generate_release_notes: true

  electron-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:electron
      - run: pnpm build:substore
      - run: pnpm build:runtime
      - run: pnpm smoke:substore
      - run: pnpm smoke:electron
      - run: pnpm dist
      - run: pnpm verify:package
      - run: pnpm report
      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velvlens-windows
          path: |
            release/*.exe
            artifacts/velvlens-substore/final-report.md
          if-no-files-found: error
